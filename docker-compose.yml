version: '3.9'

networks:
  mockclaw-net:
    driver: bridge

services:
  # Brain Service - FastAPI Backend
  brain:
    image: python:3.11-slim
    container_name: mockclaw-brain
    working_dir: /app
    volumes:
      - ./src:/app
      - ./captures:/captures
      - ./mocks:/mocks
    ports:
      - "8000:8000"
    networks:
      - mockclaw-net
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    command: >
      bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - redis
    restart: unless-stopped

  # Dashboard Service - Next.js Frontend
  dashboard:
    image: node:18-alpine
    container_name: mockclaw-dashboard
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "3000:3000"
    networks:
      - mockclaw-net
    environment:
      - NEXT_PUBLIC_API_URL=http://brain:8000
    command: >
      sh -c "npm install && npm run dev"
    depends_on:
      - brain
    restart: unless-stopped

  # Capture Service - Traffic Interceptor
  capture:
    image: python:3.11-slim
    container_name: mockclaw-capture
    working_dir: /app
    volumes:
      - ./src/capture:/app
      - ./captures:/captures
    ports:
      - "8080:8080"
    networks:
      - mockclaw-net
    environment:
      - BRAIN_URL=http://brain:8000
    command: >
      bash -c "pip install -r requirements.txt && python capture.py"
    depends_on:
      - brain
    restart: unless-stopped

  # Mock Server - Generated Mock APIs
  mock-server:
    image: node:18-alpine
    container_name: mockclaw-server
    working_dir: /app
    volumes:
      - ./mocks:/app
    ports:
      - "4000:4000"
    networks:
      - mockclaw-net
    command: >
      sh -c "npm install express cors && node server.js"
    restart: unless-stopped

  # Redis - Caching Layer
  redis:
    image: redis:7-alpine
    container_name: mockclaw-redis
    ports:
      - "6379:6379"
    networks:
      - mockclaw-net
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis-data: