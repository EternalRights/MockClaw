name: Chaos Engineering Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of test iterations'
        required: false
        default: '1'

env:
  PYTHON_VERSION: '3.11'
  DOCKER_ENABLED: 'false'  # Will be set to true if Docker available

jobs:
  chaos-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt
        pip install pytest pytest-asyncio requests
    
    - name: Verify HAR file
      run: |
        if [ ! -f "tests/gauntlet/flow.har" ]; then
          echo "❌ HAR file not found!"
          exit 1
        fi
        echo "✅ HAR file found"
        python -c "import json; json.load(open('tests/gauntlet/flow.har'))"
        echo "✅ HAR file is valid JSON"
    
    - name: Generate mocks from HAR
      run: |
        echo "Generating mocks from HAR file..."
        python regenerate_mocks.py
        
        # Verify generated files
        if [ ! -f "generated_mocks/dynamic_api.py" ]; then
          echo "❌ Mock generation failed!"
          exit 1
        fi
        echo "✅ Mocks generated successfully"
    
    - name: Run pytest suite
      run: |
        echo "Running pytest test suite..."
        python -m pytest tests/ -v --tb=short
    
    - name: Run chaos tests (Standard Mode)
      run: |
        echo "Running standard chaos tests..."
        python scripts/enhanced_chaos_test.py
        
        if [ $? -ne 0 ]; then
          echo "❌ Standard chaos tests failed"
          exit 1
        fi
        echo "✅ Standard chaos tests passed"
    
    - name: Setup Docker (if available)
      run: |
        # Check if Docker is available
        if command -v docker &> /dev/null; then
          echo "✅ Docker available"
          echo "DOCKER_ENABLED=true" >> $GITHUB_ENV
          
          # Try to start Docker daemon (GitHub Actions has Docker)
          sudo systemctl start docker 2>/dev/null || true
        else
          echo "⚠️ Docker not available, skipping hardcore tests"
        fi
    
    - name: Run hardcore chaos tests (if Docker available)
      if: env.DOCKER_ENABLED == 'true'
      run: |
        echo "Running hardcore chaos tests with Docker..."
        python scripts/hardcore_chaos_test.py --use-docker
        
        if [ $? -ne 0 ]; then
          echo "❌ Hardcore chaos tests failed"
          exit 1
        fi
        echo "✅ Hardcore chaos tests passed"
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: chaos-test-results
        path: |
          logs/*.json
          logs/*.log
        retention-days: 7
    
    - name: Generate test report
      if: always()
      run: |
        echo "## Chaos Test Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "logs/chaos_results.json" ]; then
          echo "### Standard Chaos Tests" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat logs/chaos_results.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -f "logs/hardcore_chaos_results.json" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Hardcore Chaos Tests" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat logs/hardcore_chaos_results.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Auto-commit results (on success)
      if: success() && github.event_name == 'schedule'
      run: |
        git config user.email "mockclaw-bot@example.com"
        git config user.name "MockClaw Bot"
        
        git add .
        
        if ! git diff --staged --quiet; then
          git commit -m "chore: auto-harden mocks [ci skip]" \
            -m "Nightly chaos test run - $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          
          # Only push if on main branch and not a PR
          if [ "${{ github.ref }}" == "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            git push origin main
          fi
        else
          echo "No changes to commit"
        fi
    
    - name: Create GitHub PR (on nightly run)
      if: success() && github.event_name == 'schedule'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: nightly chaos hardening"
        title: "[BOT] Nightly Chaos Hardening"
        body: |
          ## Nightly Chaos Test Results
          
          ✅ All chaos tests passed!
          
          ### Changes:
          - Auto-generated mocks from HAR file
          - Applied resilience middleware
          - Verified path traversal protection
          - Verified rate limiting
          
          ### Test Results:
          - Standard Chaos Tests: PASSED
          - Hardcore Tests: ${{ env.DOCKER_ENABLED == 'true' && 'PASSED' || 'SKIPPED (Docker unavailable)' }}
          
          ---
          *This PR was automatically created by the MockClaw CI Pipeline*
        branch: bot/nightly-chaos-${{ github.run_id }}
        delete-branch: true
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Chaos tests failed!"
        echo ""
        echo "Please review the test logs:"
        echo "- Standard tests: logs/chaos_results.json"
        echo "- Hardcore tests: logs/hardcore_chaos_results.json"
        echo ""
        echo "To reproduce locally:"
        echo "  python scripts/ci_immortal.bat"
