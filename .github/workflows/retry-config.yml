# MockClaw Retry Configuration
# Auto-generated resilience documentation

name: Network Retry Configuration
description: Documents the exponential backoff retry strategy implemented for MockClaw

retry_strategy:
  max_attempts: 180
  max_duration_minutes: 30
  base_delay_seconds: 10
  max_delay_seconds: 320
  strategy: exponential_backoff_with_jitter

network_failure_patterns:
  - "Connection timed out"
  - "SSL certificate problem"
  - "Port 443"
  - "EPIPE"
  - "ECONNRESET"
  - "Failed to connect"
  - "Could not connect"
  - "Connection was reset"
  - "Recv failure"

resilience_features:
  - Automatic connectivity checks (Test-NetConnection) before each attempt
  - Exponential backoff (2^n seconds) to avoid overwhelming network
  - Detailed logging to network_retry.log with timestamps
  - 30-minute maximum retry window
  - GitHub credential helper for secure token storage
  - Timeout handling (90 second timeout per push attempt)

implementation:
  scripts:
    - network_retry.ps1: Exponential backoff retry script
    - secure_push.ps1: Secure push with credential helper
    - push_retry.ps1: Simple retry