version: '3.8'

services:
  # Mock Server - runs generated mocks
  mock-server:
    build:
      context: ..
      dockerfile: test_order_service/Dockerfile
    container_name: order-service-mock
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; exit(0 if httpx.get('http://localhost:8000/health').status_code == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - test-network

  # Test Runner - runs pytest against the mock server
  test-runner:
    image: python:3.11-slim
    container_name: order-service-tests
    working_dir: /app
    volumes:
      - ../test_order_service:/app
    depends_on:
      mock-server:
        condition: service_healthy
    environment:
      - MOCK_SERVER_URL=http://mock-server:8000
    command: >
      sh -c "
        pip install pytest pytest-asyncio httpx &&
        python -m pytest test_order_scenarios.py -v --asyncio-mode=auto &&
        echo '✅ All tests completed'
      "
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
