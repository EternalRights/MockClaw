[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mockclaw"
version = "0.2.0"
description = "Generate mock APIs from HAR files with chaos engineering"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "EternalRights", email = "mockclaw@example.com"},
]
keywords = ["mock", "api", "har", "testing", "chaos-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Mocking",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.3",
    "typer>=0.9.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
llm = ["openai>=1.10.0"]
perf = ["orjson>=3.9.0"]
docker = ["docker>=7.0.0"]
test = ["httpx>=0.26.0"]

[project.urls]
Homepage = "https://github.com/EternalRights/MockClaw"
Repository = "https://github.com/EternalRights/MockClaw.git"
Issues = "https://github.com/EternalRights/MockClaw/issues"

[project.scripts]
mockclaw = "cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mockclaw = ["*.md"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "integration: mark test as integration test (requires server)",
    "slow: mark test as slow running",
    "llm: mark test as requiring LLM API key",
]
asyncio_mode = "auto"

# ---------- ruff ----------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["mockclaw"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B011"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
